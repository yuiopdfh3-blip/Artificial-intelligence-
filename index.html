<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميتيس - Metis AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Cairo & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#0f172a'
                        },
                        darkbg: '#0d0d12',
                        darkcard: '#16161e',
                        userbubble: '#222330'
                    },
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: #0d0d12;
            color: #ececee;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b3b52;
        }

        /* Typing cursor animation */
        .typing-indicator::after {
            content: '▋';
            display: inline-block;
            animation: blink 0.8s infinite;
            color: #818cf8;
            margin-right: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Markdown Styles in Responses */
        .prose pre {
            background-color: #12121a;
            border: 1px solid #282838;
            border-radius: 0.75rem;
            padding: 1rem;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .prose code {
            font-family: monospace;
            color: #e2e8f0;
            background: rgba(255,255,255,0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .prose pre code {
            background: transparent;
            padding: 0;
        }
        .prose p {
            margin-bottom: 0.75rem;
            line-height: 1.7;
        }
        .prose ul {
            list-style-type: disc;
            padding-right: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .prose ol {
            list-style-type: decimal;
            padding-right: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .prose strong {
            color: #ffffff;
            font-weight: 600;
        }
        .prose a {
            color: #818cf8;
            text-decoration: underline;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden bg-darkbg text-gray-100">

    <!-- Top Navigation Header -->
    <header class="w-full h-14 px-6 flex items-center justify-between border-b border-gray-800/60 bg-darkbg/80 backdrop-blur-md z-10 shrink-0">
        <div class="flex items-center space-x-3 space-x-reverse">
            <span class="text-xl font-bold tracking-wide text-white">ميتيس</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-medium border border-indigo-500/20">3.1 Flash</span>
        </div>
        <div class="flex items-center gap-3">
            <button id="clear-chat-btn" title="محادثة جديدة" class="text-gray-400 hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
                <i class="fa-regular font-light fa-pen-to-square text-lg"></i>
            </button>
            <button id="settings-btn" title="الإعدادات" class="text-gray-400 hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
                <i class="fa-solid fa-sliders text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-0 py-6 w-full max-w-3xl mx-auto flex flex-col space-y-6">
        
        <!-- Welcome Screen (Centered Minimalist Text) -->
        <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center text-center my-auto transition-all duration-300">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-3">كيف يمكنني مساعدتك اليوم؟</h1>
            <p class="text-gray-400 text-sm max-w-md">اسأل ميتيس أي سؤال، اطلب كتابة كود، أو قم بتحليل البيانات بكل سهولة.</p>
        </div>

        <!-- Chat Messages List -->
        <div id="messages-list" class="w-full space-y-6 flex flex-col hidden">
            <!-- Messages dynamic injection -->
        </div>

    </main>

    <!-- Bottom Input Container -->
    <footer class="w-full max-w-3xl mx-auto px-4 pb-6 pt-2 shrink-0">
        <form id="chat-form" class="relative flex items-center bg-darkcard border border-gray-800 focus-within:border-gray-700 rounded-2xl shadow-2xl transition-all">
            <textarea 
                id="user-input" 
                rows="1" 
                placeholder="اسأل ميتيس..." 
                class="w-full bg-transparent text-gray-100 placeholder-gray-500 py-4 pr-5 pl-14 resize-none focus:outline-none text-base leading-relaxed max-h-48 overflow-y-auto"
                style="min-height: 56px;"></textarea>
            
            <button 
                type="submit" 
                id="send-btn"
                disabled
                class="absolute left-3 p-2.5 rounded-xl bg-white text-black disabled:bg-gray-800 disabled:text-gray-600 transition-all cursor-pointer disabled:cursor-not-allowed">
                <i class="fa-solid fa-arrow-up text-base"></i>
            </button>
        </form>
        <div class="text-center mt-2">
            <span class="text-[11px] text-gray-600">قد يعرض ميتيس معلومات غير دقيقة، يرجى التحقق من المصادر.</span>
        </div>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-darkcard border border-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-200" id="settings-card">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-white">إعدادات النظام</h3>
                <button id="close-settings" class="text-gray-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-2">مفتاح API الخاص بك (Gemini API Key)</label>
                    <input 
                        type="password" 
                        id="api-key-input" 
                        placeholder="أدخل مفتاح AI..." 
                        class="w-full bg-darkbg border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    <p class="text-[11px] text-gray-500 mt-2">المفتاح يتم حفظه محلياً في متصفحك فقط ولا يشارك مع أي طرف آخر.</p>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-2">تعليمات النظام (System Prompt)</label>
                    <textarea 
                        id="system-prompt-input" 
                        rows="3"
                        placeholder="حدد طريقة إجابة ميتيس..." 
                        class="w-full bg-darkbg border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">أنت مساعد ذكاء اصطناعي محترف وفاخر يدعى "ميتيس". تجيب بدقة، وضوح، وأسلوب عصري أنيق.</textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button id="save-settings" class="w-full bg-white text-black font-semibold py-2.5 rounded-xl hover:bg-gray-200 transition-colors text-sm">
                    حفظ التغييرات
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // App State
        const state = {
            apiKey: localStorage.getItem('metis_api_key') || '',
            systemPrompt: localStorage.getItem('metis_system_prompt') || 'أنت مساعد ذكاء اصطناعي محترف وفاخر يدعى "ميتيس". تجيب بدقة، وضوح، وأسلوب عصري أنيق.',
            messages: [],
            isGenerating: false
        };

        // DOM Elements
        const elements = {
            chatContainer: document.getElementById('chat-container'),
            welcomeScreen: document.getElementById('welcome-screen'),
            messagesList: document.getElementById('messages-list'),
            chatForm: document.getElementById('chat-form'),
            userInput: document.getElementById('user-input'),
            sendBtn: document.getElementById('send-btn'),
            clearChatBtn: document.getElementById('clear-chat-btn'),
            settingsBtn: document.getElementById('settings-btn'),
            settingsModal: document.getElementById('settings-modal'),
            settingsCard: document.getElementById('settings-card'),
            closeSettings: document.getElementById('close-settings'),
            saveSettings: document.getElementById('save-settings'),
            apiKeyInput: document.getElementById('api-key-input'),
            systemPromptInput: document.getElementById('system-prompt-input')
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            elements.apiKeyInput.value = state.apiKey;
            elements.systemPromptInput.value = state.systemPrompt;

            // Configure Marked Options
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true
            });

            setupEventListeners();
        });

        // Event Listeners
        function setupEventListeners() {
            // Textarea Auto Resize & Button Enable Logic
            elements.userInput.addEventListener('input', () => {
                elements.userInput.style.height = 'auto';
                elements.userInput.style.height = Math.min(elements.userInput.scrollHeight, 192) + 'px';
                elements.sendBtn.disabled = !elements.userInput.value.trim() || state.isGenerating;
            });

            // Handle Enter Key Press
            elements.userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (elements.userInput.value.trim() && !state.isGenerating) {
                        elements.chatForm.dispatchEvent(new Event('submit'));
                    }
                }
            });

            // Form Submit
            elements.chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = elements.userInput.value.trim();
                if (!text || state.isGenerating) return;
                
                handleUserSend(text);
            });

            // Clear Chat
            elements.clearChatBtn.addEventListener('click', () => {
                state.messages = [];
                elements.messagesList.innerHTML = '';
                elements.messagesList.classList.add('hidden');
                elements.welcomeScreen.classList.remove('hidden');
            });

            // Settings Modal Open/Close
            elements.settingsBtn.addEventListener('click', openSettings);
            elements.closeSettings.addEventListener('click', closeSettings);
            elements.settingsModal.addEventListener('click', (e) => {
                if (e.target === elements.settingsModal) closeSettings();
            });

            // Save Settings
            elements.saveSettings.addEventListener('click', () => {
                state.apiKey = elements.apiKeyInput.value.trim();
                state.systemPrompt = elements.systemPromptInput.value.trim();

                localStorage.setItem('metis_api_key', state.apiKey);
                localStorage.setItem('metis_system_prompt', state.systemPrompt);

                closeSettings();
            });
        }

        function openSettings() {
            elements.settingsModal.classList.remove('hidden');
            setTimeout(() => {
                elements.settingsModal.classList.remove('opacity-0');
                elements.settingsCard.classList.remove('scale-95');
            }, 10);
        }

        function closeSettings() {
            elements.settingsModal.classList.add('opacity-0');
            elements.settingsCard.classList.add('scale-95');
            setTimeout(() => {
                elements.settingsModal.classList.add('hidden');
            }, 200);
        }

        // Handle User Input Submission
        async function handleUserSend(text) {
            // Hide welcome screen if first message
            if (state.messages.length === 0) {
                elements.welcomeScreen.classList.add('hidden');
                elements.messagesList.classList.remove('hidden');
            }

            // Reset input field
            elements.userInput.value = '';
            elements.userInput.style.height = '56px';
            elements.sendBtn.disabled = true;

            // Push User Message
            state.messages.push({ role: 'user', text: text });
            renderUserMessage(text);

            // Scroll to bottom
            scrollToBottom();

            // Fetch Gemini AI Stream/Response
            await fetchMetisResponse();
        }

        // Render User Message (Gray Curved Bubble on the Left/Right)
        function renderUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex justify-start w-full';
            
            const bubble = document.createElement('div');
            bubble.className = 'bg-userbubble text-gray-100 px-5 py-3.5 rounded-2xl max-w-[85%] sm:max-w-[75%] leading-relaxed text-sm sm:text-base border border-gray-800/50 shadow-sm';
            bubble.textContent = text;
            
            msgDiv.appendChild(bubble);
            elements.messagesList.appendChild(msgDiv);
        }

        // Render Metis AI Response Container (No bubble, Clean Free Text)
        function createMetisMessageContainer() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex flex-col w-full text-gray-100 text-sm sm:text-base leading-relaxed pl-2 pr-1 pt-1';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'prose text-gray-200 w-full typing-indicator';
            
            msgDiv.appendChild(contentDiv);
            elements.messagesList.appendChild(msgDiv);
            
            return contentDiv;
        }

        // Call Gemini API
        async function fetchMetisResponse() {
            state.isGenerating = true;
            const contentContainer = createMetisMessageContainer();
            scrollToBottom();

            // Format contents payload for Gemini API
            const contents = state.messages.map(m => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.text }]
            }));

            const payload = {
                contents: contents,
                systemInstruction: {
                    parts: [{ text: state.systemPrompt }]
                }
            };

            const apiKey = state.apiKey;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || 'تعذر الاتصال بالخدمة.');
                }

                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || 'لم أتمكن من إيجاد إجابة مناسبة.';

                // Typing animation effect
                await animateTyping(contentContainer, aiText);

                // Save to history
                state.messages.push({ role: 'model', text: aiText });

            } catch (error) {
                contentContainer.classList.remove('typing-indicator');
                contentContainer.innerHTML = `<span class="text-red-400">عذراً، حدث خطأ: ${error.message}</span>`;
            } finally {
                state.isGenerating = false;
                elements.sendBtn.disabled = !elements.userInput.value.trim();
            }
        }

        // Simulate Smooth Text Typing Effect
        async function animateTyping(container, fullText) {
            container.classList.add('typing-indicator');
            let currentText = '';
            const chunkSize = 4; // Render in chunks for speed and smoothness
            
            for (let i = 0; i < fullText.length; i += chunkSize) {
                currentText += fullText.slice(i, i + chunkSize);
                container.innerHTML = marked.parse(currentText);
                scrollToBottom();
                await new Promise(resolve => setTimeout(resolve, 12));
            }

            container.classList.remove('typing-indicator');
            container.innerHTML = marked.parse(fullText);
            
            // Re-highlight code blocks
            container.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
            
            scrollToBottom();
        }

        // Auto Scroll Functionality
        function scrollToBottom() {
            elements.chatContainer.scrollTo({
                top: elements.chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
